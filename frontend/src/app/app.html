 <div class="container">
  <h1>AI Image Captioner</h1>

  <div class="box">
    <input type="file" (change)="onFileSelected($event)" accept="Image/*">
  </div> 

  <div class="box">
    <button (click)="onUpload()" [disabled]="!selectedFile">
      Analyzing the Image
    </button>
  </div>

  <hr>

  @if (caption) {
    <div class="result">
      <h3>Analyzing Result: </h3>
      <p>{{caption}}</p>
    </div>
  }
</div>
